services:
  - type: web
    name: botnet-detection-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn botnet_attacks.wsgi:application --bind 0.0.0.0:$PORT
    preDeployCommand: python manage.py migrate
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: botnet-detection-db
          property: connectionString

databases:
  - name: botnet-detection-db
